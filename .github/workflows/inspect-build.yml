name: Inspect XZ1 VDSO config

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lineage-21

      - name: Check compatibility settings
        shell: bash
        run: |
          set -eu

          CONFIG="arch/arm64/configs/lineage-msm8998-yoshino-poplar_defconfig"

          echo "=== ARM64 compatibility config ==="
          grep -nE \
            'CONFIG_(COMPAT|COMPAT_VDSO|ARM64|ARM64_LSE_ATOMICS)' \
            "$CONFIG" || true

          echo "=== Toolchain-related config ==="
          grep -nE \
            'CONFIG_(CROSS_COMPILE|CROSS_COMPILE_ARM32|CC_IS_CLANG|GCC_VERSION|CLANG_VERSION)' \
            "$CONFIG" || true

          echo "Inspection completed."
          
