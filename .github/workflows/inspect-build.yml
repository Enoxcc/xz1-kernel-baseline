name: Inspect XZ1 kernel compiler config

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: lineage-21

      - name: Inspect compiler configuration
        shell: bash
        run: |
          set -eu

          CONFIG="arch/arm64/configs/lineage-msm8998-yoshino-poplar_defconfig"

          echo "=== Compiler settings in XZ1 defconfig ==="
          grep -nE \
            'CONFIG_(CROSS_COMPILE|CROSS_COMPILE_ARM32|CC_VERSION_TEXT|CLANG_VERSION|LLVM)' \
            "$CONFIG" || true

          echo "=== README build guidance ==="
          sed -n '1,180p' README

          echo "=== Architecture toolchain requirements ==="
          sed -n '45,100p' arch/arm64/Makefile

          echo "=== Compiler scripts ==="
          ls -l scripts/clang-version.sh scripts/gcc-version.sh

          echo "Inspection completed."
          
